<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Catálogo Ribeiro Imobiliária</title>
    <meta
      name="description"
      content="Casas, apartamentos e terrenos à venda e para alugar com a Ribeiro Imobiliária."
    />

    <!--
      Estas tags Open Graph/Twitter são o fallback estático do site inteiro —
      o único conteúdo que bots de pré-visualização de link (WhatsApp,
      Telegram, Facebook) enxergam, já que eles não executam JavaScript e por
      isso nunca veem o que src/hooks/use-seo.ts define por página. Páginas
      específicas (imóvel, catálogo) têm título/descrição melhores via JS,
      úteis pra Googlebot e pra aba do navegador, mas não pra esses bots.
    -->
    <meta property="og:site_name" content="Ribeiro Imobiliária" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Catálogo Ribeiro Imobiliária" />
    <meta
      property="og:description"
      content="Casas, apartamentos e terrenos à venda e para alugar com a Ribeiro Imobiliária."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
